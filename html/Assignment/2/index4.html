<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>HTML Attributes in Action</h1>

    <!-- Paragraph with title attribute -->
    <h2>1. Title Attribute</h2>

    <p title="HTML stands for HyperText Markup Language">
        Move your mouse over this paragraph to see extra information.
    </p>

    <hr>

    <!-- Three student paragraphs with unique colors -->
    <h2>2. Student Information</h2>

    <p style="color: red;">
        Student 1: Mayur Mulmule
    </p>

    <p style="color: blue;">
        Student 2: Rohit Patil
    </p>

    <p style="color: green;">
        Student 3: Ramesh Sharma
    </p>

    <hr>

    <!-- Image with src, alt, width, and height attributes -->
    <h2>3. Image Attributes</h2>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRP_KxvpOAHp31C3JDaqnUd4TSh4pc2ZW-yrPDb5abYxA&s"
         alt="Student studying at a desk"
         width="300"
         height="200">
</body>
</html>

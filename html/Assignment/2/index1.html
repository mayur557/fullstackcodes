<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>HTML Building Blocks</h1>

    <p>
        HTML stands for HyperText Markup Language. It is used to
        create the structure of web pages using elements such as
        headings, paragraphs, images, and links.
    </p>

    <!-- Example 1: Opening tag, content, and closing tag -->
    <h2>Example of an HTML Element</h2>

    <p>Hello, welcome to HTML!</p>

    <!-- Example 2: Void element using the br tag -->
    <h2>Example of a Void Element</h2>

    <p>
        Hello!<br>
        Welcome to my webpage.
    </p>

    
</body>
</html>
